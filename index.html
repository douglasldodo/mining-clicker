<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e6eaf0;--card:#fff;--tx:#1b2230;--mut:#5d687c;--ac:#d98a00;--acx:#fff;--bd:#c9d1de;--ok:#1f8f52;--bad:#c0392b;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f131b;--card:#192030;--tx:#e9eef8;--mut:#93a0b8;--ac:#ffb62e;--acx:#1b1400;--bd:#2c3750;--ok:#46d283;--bad:#ff6b5b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f131b;--card:#192030;--tx:#e9eef8;--mut:#93a0b8;--ac:#ffb62e;--acx:#1b1400;--bd:#2c3750;--ok:#46d283;--bad:#ff6b5b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Verdana,Tahoma,"Segoe UI",sans-serif;font-size:14px;min-height:100%;-webkit-user-select:none;user-select:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:640px;margin:0 auto;padding:10px 12px 40px}
h1{font-size:20px;margin:4px 0 8px;font-weight:800;letter-spacing:.2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px 10px;font-weight:700}
.chip.coin{border-color:var(--ac)}
.tabs{display:flex;gap:4px;margin:8px 0;overflow-x:auto}
.tabs button{flex:1;white-space:nowrap}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
button.on,button.go{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.map{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.map button{min-width:112px;text-align:left;font-size:12px}
.map button small{display:block;color:var(--mut)}
.map button.on small{color:var(--acx)}
.ore-stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:310px;margin:12px 0 8px;padding:18px;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 75%,#465064 0,#26354a 38%,#101a2b 78%);box-shadow:inset 0 0 35px #050a14,0 8px 24px #050a1455;touch-action:manipulation}.ore-stage:before{content:"";position:absolute;inset:auto 8% 14px;height:30px;border-radius:50%;background:#050a14aa;filter:blur(12px)}.ore-core{position:relative;z-index:1;width:min(74vw,310px);height:250px;border:0;background:transparent;padding:0;filter:drop-shadow(0 22px 14px #050812aa);transition:transform .09s,filter .15s;touch-action:manipulation}.ore-core:active,.ore-core.hit{transform:translateY(5px) scale(.96);filter:drop-shadow(0 9px 8px #050812aa)}.ore-core svg{width:100%;height:100%;overflow:visible}.ore-hp{position:absolute;z-index:2;left:12%;right:12%;bottom:12px;height:12px;border-radius:99px;background:#0a1220;border:2px solid #718096;overflow:hidden;box-shadow:0 2px 8px #0009}.ore-hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#38c77b,#b4f46b);transition:width .12s}.ore-label{position:absolute;z-index:2;top:12px;left:12px;right:12px;text-align:center;color:#eaf3ff;font-weight:800;text-shadow:0 2px 4px #000;pointer-events:none}.ore-particle{position:absolute;z-index:4;left:50%;top:52%;font-size:20px;pointer-events:none;animation:oreBurst .75s ease-out forwards;filter:drop-shadow(0 2px 3px #000)}@keyframes oreBurst{0%{opacity:1;transform:translate(-50%,-50%) scale(.65)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1.25)}}.ore-stage.crack{animation:oreShake .18s linear}@keyframes oreShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.row small{color:var(--mut);display:block;margin-top:2px}
.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.pet{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:12px}
.pet.eq{border-color:var(--ac);border-width:2px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
#t{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#t.s{opacity:1}
h2{font-size:15px;margin:12px 0 6px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px;width:110px;-webkit-user-select:text;user-select:text}
.f{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.f label{display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:2px}
.boss{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:2px solid var(--bad);border-radius:10px;padding:8px 10px;margin-top:8px}
.boss[hidden]{display:none}
.boss .bar{flex:1 1 100%;height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
.boss .bar i{display:block;height:100%;width:100%;background:var(--bad)}
.boss button{margin-left:auto;touch-action:manipulation}

:root{--gold:#f6b93b}
body{background:radial-gradient(ellipse at 50% -15%,#344967 0,#182538 42%,#101827 100%);color:#f4f7fc}

h1{font-size:clamp(22px,5vw,30px);background:linear-gradient(90deg,#fff1bf,#f6b93b);-webkit-background-clip:text;background-clip:text;color:transparent;margin:8px 0 14px}
.chip{background:#202d40;border:1px solid #3a4b64;color:#eaf1fc;padding:7px 11px}.chip.coin{background:#493717;border-color:#bd8625;color:#ffe3a0}

.tabs button.on,.tabs button.go{background:linear-gradient(135deg,#ffcf62,#e99a1a);border-color:#ffcf62;color:#30200a;box-shadow:0 4px 14px #e99a1a30}

.map button,.row,.f,.boss{background:#202e43;border-color:#3a4d67;color:#edf3fc;border-radius:13px}.map button.on{background:#73501c;border-color:#e7ac3d}.map button small,.row small{color:#b8c7db}
.ore-stage{border:1px solid #52627a}.ore-core{cursor:pointer}.ore-core:focus-visible{outline:3px solid #ffca55;outline-offset:4px;border-radius:30px}
button{border-radius:10px;transition:transform .13s,border-color .13s}button:not(:disabled):active{transform:scale(.98)}
.row{padding:13px;margin-bottom:9px;gap:12px}.pet{background:#1a2940;border-color:#40536f;border-radius:12px;padding:10px;color:#edf3fc}.pet.eq{background:#493717;border-color:#f6b93b}
.f{padding:13px}input,select{background:#101a2a;border-color:#40516a;color:#f4f7fc}.boss{border-color:#e45a5a}
#st{color:#b7c5d9!important;line-height:1.6}
.panel-title{font-size:17px;font-weight:900;color:#ffe0a0;margin:5px 0 12px}
.mission{background:linear-gradient(135deg,#263952,#1c2a3e);border:1px solid #425875;border-radius:14px;padding:13px;margin:9px 0}.mission.done{border-color:#4bbd82}
.mission-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.mission-title{font-weight:800;color:#fff}.mission-desc{font-size:12px;color:#b8c7db;margin:6px 0 10px}
.progress{height:9px;background:#101a2a;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#48c987,#a3edaa);border-radius:99px}

.chest-card{display:flex;align-items:center;gap:13px;background:linear-gradient(135deg,#483719,#26344a);border:1px solid #bd8c35;border-radius:14px;padding:12px;margin:8px 0}.chest-icon{font-size:36px;filter:drop-shadow(0 4px 5px #0008)}.chest-card small{display:block;color:#d5c49f;margin-top:3px}
@media(max-width:420px){main{padding:10px 9px 40px}.tabs button{padding:9px 11px;font-size:12px}.row{padding:10px}}

.pet-card{display:flex;align-items:center;gap:10px;padding:12px;margin:9px 0;border:1px solid var(--line);border-radius:14px;background:#111d30}.pet-avatar{width:54px;height:54px;flex:0 0 54px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#334155,#111827);font-size:29px;border:2px solid #64748b;box-shadow:inset 0 2px 8px #fff2}.pet-avatar.stage-1{border-color:#34d399;filter:drop-shadow(0 0 5px #34d39988)}.pet-avatar.stage-2{border-color:#a78bfa;filter:drop-shadow(0 0 8px #a78bfa)}.pet-avatar.stage-3{border-color:#fbbf24;filter:drop-shadow(0 0 12px #fbbf24);animation:petGlow 2s infinite alternate}.pet-info{flex:1;min-width:0}.pet-info small{display:block;color:var(--mut);font-size:11px;margin-top:3px}.pet-card .go{padding:8px;font-size:11px;white-space:nowrap}@keyframes petGlow{to{box-shadow:0 0 18px #fbbf2488}}.muted{color:var(--mut);font-size:12px;line-height:1.5}

/* Realistic fantasy mine atmosphere */
:root{--gold:#f2bd58;--stone:#263344;--stone-edge:#65758a;--ink:#0a111b}

.chips{gap:7px}.chip{background:linear-gradient(180deg,#34465c,#1a2839);border:1px solid #71839a;border-bottom-color:#27374b;border-radius:8px;box-shadow:inset 0 1px #ffffff18,0 3px 9px #0005;padding:7px 10px;font-size:12px}.chip.coin{background:linear-gradient(180deg,#765622,#3b2a13);border-color:#d8a64b;color:#ffedbd}

function oreSVG(){const z=ZONES[S.zone],a=z.a||"#aab1b8",b=z.b||"#59616d";return '<svg viewBox="0 0 320 260" role="img" aria-label="Minério de '+z.n+'"><defs><linearGradient id="oreFace" x1="0" y1="0" x2="1" y2="1"><stop stop-color="'+a+'"/><stop offset=".48" stop-color="'+b+'"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="oreGlow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="M45 175 32 118 76 53 132 26 184 37 235 20 286 83 274 160 222 220 148 239 77 218Z" fill="#080d17" opacity=".7"/><path d="M42 169 34 112 80 48 135 30 182 46 228 29 278 83 268 155 222 207 148 230 78 210Z" fill="url(#oreFace)" stroke="#dce7f2" stroke-opacity=".28" stroke-width="4"/><path d="m80 48 55-18 47 16-30 65-75 8-43-7Z" fill="'+a+'" opacity=".72"/><path d="m177 46 51-17 50 54-61 28-65 0Z" fill="'+b+'" opacity=".9"/><path d="m34 112 43 7 37 70-36 21-56-41Z" fill="#111827" opacity=".55"/><path d="m112 189 56-78 65-28 45 72-56 52-74 23Z" fill="url(#oreFace)" opacity=".95"/><path d="m80 48 55-18 47 16-30 65-75 8-43-7Z" fill="url(#oreGlow)" opacity=".45"/><path d="m101 83 23-19 20 5-13 23-22 9Z" fill="#fff" opacity=".25"/><path d="m187 133 21-25 14 8-15 25Z" fill="'+a+'" opacity=".7"/><path d="m118 190 30-27 23 7-18 37-27 7Z" fill="'+b+'" opacity=".75"/><path d="m222 207 46-52-6 28-40 32-74 15Z" fill="#080d17" opacity=".35"/></svg>'}
function build(){const z=ZONES[S.zone],el=$("#gr");el.style.setProperty("--z",z.col);blocks=[spawn()];el.innerHTML=`<div class="ore-label">${z.e} ${z.n} · toque para minerar</div><button class="ore-core" id="oreCore" aria-label="Minerar minério central" onclick="hit(0)">${oreSVG()}</button><div class="ore-hp"><i id="oreHp"></i></div>`}
function oreParticles(z,count=9){const stage=$("#gr");if(!stage)return;const icons=[MAT[z.m]||"✨","✦","✧","◆","●"];for(let i=0;i<count;i++){const p=document.createElement("span");p.className="ore-particle";p.textContent=icons[Math.floor(Math.random()*icons.length)];p.style.setProperty("--dx",(Math.random()*220-110)+"px");p.style.setProperty("--dy",(Math.random()*-170-25)+"px");p.style.setProperty("--rot",(Math.random()*240-120)+"deg");stage.appendChild(p);setTimeout(()=>p.remove(),800)}}
function hit(i,d){d=d||dmg();const b=blocks[0],z=ZONES[S.zone];if(!b)return;b.hp-=d*minePower(S.zone);oreParticles(z,Math.min(16,6+Math.floor(Math.random()*5)));const core=$("#oreCore");if(core){core.classList.remove("hit");void core.offsetWidth;core.classList.add("hit")}if(b.hp<=0){const g=z.coin*coinM()*mineYield(S.zone)*(.8+Math.random()*.4);S.coins+=g;S.tot+=g;S.mats[z.m]=(S.mats[z.m]||0)+1+(Math.random()<.5?1:0);gainXP(5+S.zone*2);gainPetXP(8+S.zone*2);missionProgress("mined",1);missionProgress("ores",1);missionProgress("coins",g);blocks[0]=spawn();oreParticles(z,24);toast("💥 Minério quebrado! +"+fmt(g)+" moedas");hdr();save()}const hp=$("#oreHp");if(hp)hp.style.width=(blocks[0].hp/blocks[0].max*100)+"%"}
function minionMine(){const d=autoLv()*dmg()*.25*enchantMultiplier("speed");if(!d)return;if(boss)hitBoss(d*.25);S.uz.forEach(i=>{const z=ZONES[i];let b=minionBlocks[i];if(!b){const hp=z.hp*S.adm.hp*(.8+Math.random()*.4);b=minionBlocks[i]={hp,max:hp}}b.hp-=d*mineAuto(i);if(b.hp<=0){const g=z.coin*coinM()*mineYield(i)*(.8+Math.random()*.4);S.coins+=g;S.tot+=g;S.mats[z.m]=(S.mats[z.m]||0)+1+(Math.random()<.5?1:0);gainXP(5+S.zone*2);gainPetXP(8+S.zone*2);missionProgress("mined",1);missionProgress("ores",1);missionProgress("coins",g);minionBlocks[i]=null}})}
function pay(c,m){if(S.coins<c)return false;for(const k in m)if((S.mats[k]||0)<m[k])return false;S.coins-=c;for(const k in m)S.mats[k]-=m[k];return true}
function P(){const p=$("#p");let h="";
if(tab=="pick"){const t=TIERS[S.tier],n=TIERS[S.tier+1];h+='<div class="row"><div><b>'+t.e+" Picareta de "+t.n+"</b><small>Dano base "+t.d+" · dano total por clique "+fmt(dmg())+"</small></div></div>";
if(n){const ok=S.coins>=n.c&&Object.keys(n.m).every(k=>(S.mats[k]||0)>=n.m[k]);if(ok)h+='<div class="notice-ready">✨ Requisitos completos! Você já pode comprar a próxima picareta.</div>';h+="<h2>Construir próxima picareta</h2><div class=\"row\"><div><b>"+n.e+" Picareta de "+n.n+"</b><small>Dano base "+n.d+"</small><small>Custa 💰 "+fmt(n.c)+"</small>"+Object.keys(n.m).map(k=>'<small class="'+((S.mats[k]||0)>=n.m[k]?"ok":"bad")+'">'+MAT[k]+" "+k+": "+fmt(S.mats[k]||0)+" / "+n.m[k]+"</small>").join("")+'</div><button class="go" '+(ok?"":"disabled")+' onclick="craft()">Construir</button></div>'}else h+="<p>Você tem a melhor picareta de moedas. Continue evoluindo com as picaretas de renascimento!</p>";h+='<div class="panel-title">🎟️ Picaretas de renascimento</div><p style="color:#b8c7db;font-size:12px">Equipamentos especiais permanentes. Custam tickets e multiplicam seu dano; não são perdidos ao renascer.</p>'+RELIC_PICKAXES.map((x,i)=>{const owned=S.relicPick>i,available=S.relicPick===i;return '<div class="row"><div><b>'+x.e+" "+x.n+"</b><small>Dano x"+fmt(x.mul)+" · "+(owned?"✅ Comprada":available?"Próxima picareta":"🔒 Bloqueada")+"</small><small>Preço: 🎟️ "+fmt(x.cost)+" tickets de renascimento</small></div><button class=\"go\" "+(available&&S.rp>=x.cost?"":"disabled")+" onclick=\"buyRelicPick("+i+")\">"+(owned?"Comprada":available?"Comprar":"Bloqueada")+"</button></div>"}).join("")}
if(tab=="missions")h+=missionsHtml();

if(tab=="progress")h+=progressHtml();
if(tab=="shop")h+='<div class="panel-title">🛒 Loja de melhorias</div><div class="chest-card"><div class="chest-icon">🎁</div><div style="flex:1"><b>Baús: '+S.chests+'</b><small>Ganhe baús nas missões e conquistas.</small><button class="go" '+(S.chests>0?'':'disabled')+' onclick="openChest()">Abrir baú</button></div></div>'+Object.keys(UP).map(k=>'<div class="row"><div><b>'+UP[k].n+"</b><small>"+UP[k].t(S.up[k])+'</small></div><button class="go" '+(S.coins>=upCost(k)?"":"disabled")+' onclick="buy(\''+k+'\')">💰 '+fmt(upCost(k))+"</button></div>").join("");
if(tab=="egg"){h+=petsHtml();h+=EGGS.map((e,i)=>'<div class="row"><div><b>🥚 '+e.n+"</b><small>"+e.p.map(x=>x[0]+" +"+Math.round(x[1]*100)+"%").join(" · ")+'</small></div><button class="go" '+(S.coins>=eggC(e)?"":"disabled")+' onclick="hatch('+i+')">💰 '+fmt(eggC(e))+"</button></div>").join("");
if(S.last)h+='<p><b>Último chocado:</b> '+S.last+"</p>";
const eq=Object.entries(S.pets).flatMap(([k,v])=>Array(v).fill(k)).sort((a,b)=>PET[b]-PET[a]).slice(0,3);
h+="<h2>Seus pets (os 3 melhores ficam equipados)</h2><div class=\"pets\">"+(Object.keys(S.pets).length?Object.entries(S.pets).sort((a,b)=>PET[b[0]]-PET[a[0]]).map(([k,v])=>'<div class="pet '+(eq.includes(k)?"eq":"")+'">'+k+" x"+v+"<br>+"+Math.round(PET[k]*100)+"%"+(eq.includes(k)?" ✔ equipado":"")+"</div>").join(""):"<p>Compre um ovo para ganhar seu primeiro pet.</p>")+"</div>"}
if(tab=="rb"){const ok=S.coins>=rbCost();h+='<div class="row"><div><b>♻️ Renascimento '+(S.rb+1)+"</b><small>Custa 💰 "+fmt(rbCost())+" · você ganha 🎟️ "+rpGain()+" e +50% de dano e moedas para sempre</small><small>Reinicia moedas, materiais, picareta, melhorias e áreas. Mantém pets e bônus de renascimento.</small></div><button class=\"go\" "+(ok?"":"disabled")+' onclick="rebirth()">'+(confirmRb?"Confirmar":"Renascer")+"</button></div><h2>Loja de renascimento (🎟️ "+S.rp+")</h2>"+Object.keys(RBU).map(k=>{const c=Math.ceil(RBU[k][1]*Math.pow(1.6,S.rbu[k]));return '<div class="row"><div><b>'+RBU[k][0]+"</b><small>Nível "+S.rbu[k]+'</small></div><button class="go" '+(S.rp>=c?"":"disabled")+' onclick="rbuy(\''+k+'\','+c+')">🎟️ '+c+"</button></div>"}).join("")}
if(tab=="rank")h+=rankHtml();
if(tab=="adm"&&OWNER)h+=admHtml();
p.innerHTML=h}

function dayKey(){return new Date().toISOString().slice(0,10)}
function weekKey(){const d=new Date(),u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));u.setUTCDate(u.getUTCDate()+4-(u.getUTCDay()||7));const y=u.getUTCFullYear(),start=new Date(Date.UTC(y,0,1));return y+"-W"+String(Math.ceil((((u-start)/86400000)+1)/7)).padStart(2,"0")}
function resetQuests(){const d=dayKey(),w=weekKey();if(S.dailyQuests.day!==d)S.dailyQuests={day:d,progress:{},claimed:[]};if(S.weeklyQuests.week!==w)S.weeklyQuests={week:w,progress:{},claimed:[]};if(S.event.day!==d)S.event={day:d,points:0,claimed:false}}
const DAILY=[{id:"ores",n:"Minerador diário",d:"Quebre 100 minérios",goal:100,type:"mined",coins:5000,chests:1},{id:"coins",n:"Renda subterrânea",d:"Ganhe 25.000 moedas",goal:25000,type:"coins",coins:12000,chests:1},{id:"boss",n:"Caçador de chefes",d:"Derrote 1 chefe",goal:1,type:"boss",rp:2,chests:1}];
const WEEKLY=[{id:"ores",n:"Semana produtiva",d:"Quebre 1.000 minérios",goal:1000,type:"mined",coins:100000,chests:3},{id:"boss",n:"Lenda das cavernas",d:"Derrote 8 chefes",goal:8,type:"boss",rp:10,chests:4},{id:"forge",n:"Mestre ferreiro",d:"Melhore a forja 3 vezes",goal:3,type:"forge",coins:75000,chests:2}];
function questProgress(type,n){}
function questClaim(kind,id){resetQuests();const list=kind==="daily"?DAILY:WEEKLY,state=kind==="daily"?S.dailyQuests:S.weeklyQuests,x=list.find(v=>v.id===id);if(!x||state.claimed.includes(id)||(state.progress[x.type]||0)<x.goal)return;state.claimed.push(id);S.coins+=x.coins||0;S.tot+=x.coins||0;S.rp+=x.rp||0;S.chests+=x.chests||0;toast("🎁 Missão concluída! Recompensas coletadas.");P();hdr();save()}
function questList(kind){const list=kind==="daily"?DAILY:WEEKLY,state=kind==="daily"?S.dailyQuests:S.weeklyQuests;return list.map(x=>{const v=Math.min(x.goal,state.progress[x.type]||0),done=v>=x.goal,claimed=state.claimed.includes(x.id);return '<div class="mission '+(done?'done':'')+'"><div class="mission-top"><b>'+(kind==="daily"?'☀️ ':'📅 ')+x.n+'</b><b>'+(claimed?'✅ Resgatada':done?'🏆 Pronta':'🎁 Recompensa')+'</b></div><div class="mission-desc">'+x.d+'</div><div class="progress"><i style="width:'+Math.min(100,v/x.goal*100)+'%"></i></div><small>'+fmt(v)+' / '+fmt(x.goal)+' · '+(x.coins?fmt(x.coins)+' moedas · ':'')+(x.rp?x.rp+' tickets · ':'')+x.chests+' baús</small>'+(done&&!claimed?'<button class="go" onclick="questClaim(\''+kind+'\',\''+x.id+'\')">Resgatar</button>':'')+'</div>'}).join('')}
const EVENTS=[{n:"Chuva de Ouro",e:"🌧️💰",d:"Ganhe 2x moedas ao minerar.",bonus:"coins"},{n:"Mineração Frenética",e:"⚡",d:"Minions causam 2x dano.",bonus:"minions"},{n:"Caça aos Cristais",e:"💎",d:"Ganhe pontos extras ao quebrar minérios.",bonus:"crystals"},{n:"Invasão de Chefes",e:"👹",d:"Chefes dão recompensas dobradas.",bonus:"boss"}];
function activeEvent(){return {bonus:"none"}}
function eventsHtml(){resetQuests();const ev=activeEvent();let h='<div class="panel-title">🎉 Evento do dia</div><div class="mission done"><div style="font-size:36px">'+ev.e+'</div><b>'+ev.n+'</b><div class="mission-desc">'+ev.d+'</div><small>Pontos do evento: '+fmt(S.event.points)+'</small><div class="progress"><i style="width:'+Math.min(100,S.event.points/1000*100)+'%"></i></div><small>Meta: 1.000 pontos · Recompensa: 25.000 moedas + 5 tickets + 3 baús</small><button class="go" '+(S.event.points<1000||S.event.claimed?'disabled':'')+' onclick="claimEvent()">Resgatar prêmio</button></div><p class="muted">O evento muda diariamente. Pontuação e resgate são salvos neste aparelho.</p><div class="panel-title">☀️ Missões diárias</div>'+questList("daily")+'<div class="panel-title">📅 Missões semanais</div>'+questList("weekly");return h}
function claimEvent(){resetQuests();if(S.event.points<1000||S.event.claimed)return;S.event.claimed=true;S.coins+=25000;S.tot+=25000;S.rp+=5;S.chests+=3;toast("🎉 Prêmio do evento resgatado!");P();hdr();save()}

const MISSIONS=[
{id:"mine",icon:"⛏️",name:"Mãos à obra",desc:"Quebre 30 blocos em qualquer mina.",goal:30,key:"mined",reward:1},
{id:"ores",icon:"💎",name:"Coletor de minérios",desc:"Colete 40 minérios minerando.",goal:40,key:"ores",reward:1},
{id:"coins",icon:"💰",name:"Fortuna subterrânea",desc:"Ganhe 2.500 moedas com mineração.",goal:2500,key:"coins",reward:2}
];
function missionProgress(k,n){if(!S.missions)S.missions=fresh().missions;S.missions[k]=(S.missions[k]||0)+n;questProgress(k,n)}
function missionsHtml(){let h='<div class="panel-title">📜 Central de missões</div><p style="color:#b8c7db;font-size:12px">Complete objetivos para ganhar baús. Seu progresso fica salvo automaticamente.</p>';h+='<div class="chest-card"><div class="chest-icon">🎁</div><div style="flex:1"><b>Baús disponíveis: '+S.chests+'</b><small>Abra para receber moedas e minérios.</small><button class="go" '+(S.chests>0?'':'disabled')+' onclick="openChest()">Abrir baú</button></div></div>';h+=MISSIONS.map(m=>{const v=Math.min(m.goal,S.missions[m.key]||0),done=v>=m.goal,claimed=!!S.missions.claimed[m.id];return '<div class="mission '+(done?'done':'')+'"><div class="mission-top"><span class="mission-title">'+m.icon+' '+m.name+'</span><b>'+(claimed?'✅ Resgatada':done?'🏆 Concluída':'🎁 +'+m.reward+' baú(s)')+'</b></div><div class="mission-desc">'+m.desc+'</div><div class="progress"><i style="width:'+(v/m.goal*100)+'%"></i></div><div style="font-size:11px;color:#c6d3e5;margin-top:5px">'+fmt(v)+' / '+fmt(m.goal)+'</div>'+(done&&!claimed?'<button class="go" onclick="claimMission(\''+m.id+'\')">Coletar recompensa</button>':'')+'</div>'}).join('');return h}
function claimMission(id){const m=MISSIONS.find(x=>x.id===id);if(!m||S.missions.claimed[id]||(S.missions[m.key]||0)<m.goal)return;S.missions.claimed[id]=true;S.chests+=m.reward;toast('🎁 Você recebeu '+m.reward+' baú(s)!');P();hdr();save()}
function openChest(){if(S.chests<=0)return;S.chests--;const coin=Math.floor((150+Math.random()*350)*(1+S.rb*.2)*(1+.08*(0)));S.coins+=coin;S.tot+=coin;const keys=Object.keys(MAT),mat=keys[Math.floor(Math.random()*keys.length)],qty=1+Math.floor(Math.random()*3);S.mats[mat]=(S.mats[mat]||0)+qty;toast('🎉 Baú aberto: +'+fmt(coin)+' moedas e '+qty+' '+MAT[mat]);P();hdr();save()}

const xpNeed=l=>Math.floor(80*Math.pow(l,1.55));
function gainXP(n){}
function buySkill(id){const x=SKILLS.find(v=>v.id===id),lv=S.skills[id]||0,cost=Math.ceil(x.base*Math.pow(1.55,lv));if(lv>=x.max||S.coins<cost)return;S.coins-=cost;S.skills[id]=lv+1;P();hdr();save();toast(x.name+" melhorada!")}

function talentsHtml(){return '<div class="panel-title">⭐ Talentos permanentes</div><p style="color:#b8c7db;font-size:12px">Use pontos de renascimento para especializar seu estilo de jogo. Os talentos sobrevivem ao renascimento.</p><div class="row"><b>🎟️ Pontos disponíveis: '+S.rp+'</b></div><div class="pets">'+TALENTS.map(x=>{const lv=S.talents[x.id]||0,c=x.base+lv*2;return '<div class="pet"><div style="font-size:27px">'+x.icon+'</div><b>'+x.name+'</b><small>'+x.desc+'</small><p><b>Nível '+lv+'/'+x.max+'</b></p><button class="go" '+(lv>=x.max||S.rp<c?'disabled':'')+' onclick="buyTalent(\''+x.id+'\')">🎟️ '+c+'</button></div>'}).join('')+'</div>'}
const ACH=[{id:"first100",name:"Primeiros passos",desc:"Ganhe 100 moedas no total",test:()=>S.tot>=100,reward:1},{id:"zone3",name:"Explorador",desc:"Desbloqueie 3 minas",test:()=>S.uz.length>=3,reward:2},{id:"pick3",name:"Ferreiro aprendiz",desc:"Construa a picareta de Ferro",test:()=>S.tier>=2,reward:2}];
function progressHtml(){let h='<div class="panel-title">🗺️ Jornada do minerador</div><div class="row"><div><b>⭐ Nível '+S.level+'</b><small>'+fmt(S.xp)+' / '+fmt(xpNeed(S.level))+' XP para o próximo nível</small></div><b>🎟️ '+S.rp+'</b></div><h2>Áreas da jornada</h2>';h+=ZONES.map((z,i)=>'<div class="row"><div><b>'+z.e+' '+z.n+'</b><small>'+(S.uz.includes(i)?'✅ Desbloqueada · Minério: '+MAT[z.m]:'🔒 Requer '+fmt(z.cost)+' moedas')+'</small></div><b>'+(S.uz.includes(i)?'Aberta':'Bloqueada')+'</b></div>').join('');h+='<h2>🏆 Conquistas</h2>'+ACH.map(a=>{const done=!!S.achievements[a.id]||a.test();return '<div class="mission '+(done?'done':'')+'"><b>'+(done?'✅ ':'🏅 ')+a.name+'</b><div class="mission-desc">'+a.desc+'</div><small>Recompensa: '+a.reward+' baú(s)</small>'+(done&&!S.achievements[a.id]?'<button class="go" onclick="claimAchievement(\''+a.id+'\')">Resgatar</button>':'')+'</div>'}).join('');h+='<h2>🔄 Novo jogo</h2><div class="row"><div><b>Começar do zero</b><small>Cria um novo save sem apagar o atual. Você poderá alternar entre save atual e novo jogo no mesmo aparelho.</small></div><button onclick="newRun()">Criar</button></div>';return h}
function claimAchievement(id){const a=ACH.find(x=>x.id===id);if(!a||S.achievements[id]||!a.test())return;S.achievements[id]=true;S.chests+=a.reward;toast("🏆 Conquista: "+a.name+" · +"+a.reward+" baú(s)");P();save()}
function newRun(){if(!confirm("Criar um novo jogo? Seu progresso atual será guardado neste aparelho e poderá ser restaurado."))return;try{localStorage.setItem("mcs_v1_backup_"+Date.now(),JSON.stringify(S));localStorage.setItem("mcs_v1_previous",JSON.stringify(S));}catch(e){}S=fresh();minionBlocks={};boss=null;bossIn=60;build();mapBar();go("mine");save();toast("Novo jogo criado. Save anterior preservado!")}


const ENCHANTS=[{id:"power",n:"Poder",e:"⚔️",desc:"+20% dano",cost:25000,m:{ferro:80}},{id:"fortune",n:"Fortuna",e:"🍀",desc:"+18% moedas",cost:40000,m:{ouro:35}},{id:"critical",n:"Crítico",e:"💥",desc:"+15% dano",cost:80000,m:{diamante:20}},{id:"speed",n:"Velocidade",e:"💨",desc:"+10% eficiência dos Minions",cost:120000,m:{cristal:25}},{id:"boss",n:"Caçador",e:"🐲",desc:"+25% dano contra chefes",cost:180000,m:{obsidiana:15}},{id:"treasure",n:"Tesouro",e:"🎁",desc:"+12% moedas e baús",cost:250000,m:{estrela:10}}];
function forgeUpgrade(){const lv=S.forge.level||0,cost=Math.ceil(15000*Math.pow(2.1,lv)),mat={ferro:Math.max(20,lv*20+20)};if(!pay(cost,mat))return toast("Faltam recursos para melhorar a forja");S.forge.level=lv+1;questProgress("forge",1);toast("🔥 Forja melhorada para nível "+S.forge.level);P();hdr();save()}
function forgeEnchant(id){const x=ENCHANTS.find(v=>v.id===id);if(!x||S.forge.enchants.includes(id)||S.forge.enchants.length>=2)return;if(!pay(x.cost,x.m))return toast("Materiais insuficientes");S.forge.enchants.push(id);toast("✨ Encantamento "+x.n+" aplicado!");P();hdr();save()}
function forgeHtml(){const lv=S.forge.level||0,cost=Math.ceil(15000*Math.pow(2.1,lv)),mat=Math.max(20,lv*20+20);let h='<div class="panel-title">🔥 Forja do minerador</div><p class="muted">Aprimore o dano base e aplique até dois encantamentos permanentes à sua picareta. A forja e os encantamentos sobrevivem ao renascimento.</p><div class="row"><div><b>🔥 Forja nível '+lv+'</b><small>Multiplicador de dano: x'+forgeMultiplier().toFixed(2)+'</small><small>Próximo nível: '+fmt(cost)+' moedas + '+mat+' ferro</small></div><button class="go" '+(S.coins<cost||(S.mats.ferro||0)<mat?'disabled':'')+' onclick="forgeUpgrade()">Melhorar</button></div><h2>✨ Encantamentos ('+S.forge.enchants.length+'/2)</h2>';h+=ENCHANTS.map(x=>{const has=S.forge.enchants.includes(x.id),ok=S.coins>=x.cost&&Object.keys(x.m).every(k=>(S.mats[k]||0)>=x.m[k]);return '<div class="row"><div><b>'+x.e+' '+x.n+(has?' · Equipado':'')+'</b><small>'+x.desc+'</small><small>'+fmt(x.cost)+' moedas · '+Object.entries(x.m).map(([k,v])=>v+' '+k).join(', ')+'</small></div><button class="go" '+(has||S.forge.enchants.length>=2||!ok?'disabled':'')+' onclick="forgeEnchant(\''+x.id+'\')">'+(has?'Aplicado':'Forjar')+'</button></div>'}).join('');return h}
const WORLDS=[{n:"Caverna Inicial",e:"🪨",zones:[0],cost:0,boss:0},{n:"Reino do Ferro",e:"⚒️",zones:[1],cost:500,boss:0},{n:"Vulcão Eterno",e:"🌋",zones:[2],cost:15000,boss:1},{n:"Mundo Cristalino",e:"💎",zones:[3,4],cost:3e5,boss:2},{n:"Reino da Obsidiana",e:"🌑",zones:[5],cost:8e7,boss:3},{n:"Mundo Congelado",e:"❄️",zones:[6],cost:1e9,boss:4},{n:"Galáxia Cósmica",e:"☄️",zones:[7,8],cost:2e10,boss:5},{n:"Dimensão Infinita",e:"✨",zones:[9],cost:1e13,boss:7}];
function worldsHtml(){let h='<div class="panel-title">🌍 Mapa de exploração</div><p class="muted">Oito mundos iniciais. Cada mundo reúne uma ou mais minas, materiais e chefes. Mundos futuros poderão ser adicionados sem apagar seu progresso.</p>';h+=WORLDS.map((w,i)=>{const open=S.worldUnlocks.includes(i);return '<div class="row"><div><b>'+w.e+' '+w.n+'</b><small>'+w.zones.map(z=>ZONES[z].n).join(' · ')+'</small><small>'+(open?'✅ Mundo desbloqueado':'🔒 '+fmt(w.cost)+' moedas · '+w.boss+' chefes derrotados')+'</small></div><button class="go" '+(open||S.coins<w.cost||S.bossWins<w.boss?'disabled':'')+' onclick="unlockWorld('+i+')">'+(open?'Desbloqueado':'Explorar')+'</button></div>'}).join('');return h}
function unlockWorld(i){const w=WORLDS[i];if(!w||S.worldUnlocks.includes(i)||S.coins<w.cost||S.bossWins<w.boss)return;S.coins-=w.cost;S.worldUnlocks.push(i);if(!S.uz.includes(w.zones[0]))S.uz.push(w.zones[0]);S.zone=w.zones[0];mapBar();build();toast("🌍 "+w.n+" descoberto!");P();hdr();save()}

function craft(){const n=TIERS[S.tier+1];if(n&&pay(n.c,n.m)){S.tier++;toast("Você construiu a picareta de "+n.n+"!");P();hdr();save()}}
function buyRelicPick(i){const x=RELIC_PICKAXES[i];if(!x||i!==S.relicPick||S.rp<x.cost)return;S.rp-=x.cost;S.relicPick++;toast("⚡ "+x.n+" comprada! Dano multiplicado por "+fmt(x.mul));P();hdr();save()}
function buy(k){const c=upCost(k);if(S.coins>=c){S.coins-=c;S.up[k]++;P();hdr();save()}}
function hatch(i){const e=EGGS[i];if(S.coins<eggC(e))return;S.coins-=eggC(e);const w=e.p.map((x,j)=>x[2]*(1+.1*S.rbu.l*j)),T=w.reduce((a,b)=>a+b,0);let r=Math.random()*T,k=0;while(r>w[k]){r-=w[k];k++}const pet=e.p[k][0];S.pets[pet]=(S.pets[pet]||0)+1;S.last=pet+" (+"+Math.round(e.p[k][1]*100)+"%)";toast("Você chocou "+pet+"!");P();hdr();save()}
function rebirth(){if(S.coins<rbCost())return;if(!confirmRb){confirmRb=true;P();return}const g=rpGain();const keep={pets:S.pets,petXP:S.petXP,petLevels:S.petLevels,petStars:S.petStars,forge:S.forge,worldUnlocks:S.worldUnlocks,bossWins:S.bossWins,bossDamage:S.bossDamage,dailyQuests:S.dailyQuests,weeklyQuests:S.weeklyQuests,event:S.event,localRecords:S.localRecords,rb:S.rb+1,rp:S.rp+g,rbu:S.rbu,last:S.last,adm:S.adm,tot:S.tot,rbn:S.rbn+1,nick:S.nick,talents:S.talents,achievements:S.achievements,daily:S.daily,relicPick:S.relicPick};S=Object.assign(fresh(),keep);boss=null;bossIn=60;bossUI();confirmRb=false;toast("Renascimento concluído! +"+g+" 🎟️");mapBar();build();P();hdr();save()}
function rbuy(k,c){if(S.rp>=c){S.rp-=c;S.rbu[k]++;P();hdr();save()}}
setInterval(()=>{resetQuests();if(autoLv())minionMine();bossTick();hdr();if(["pick","shop","rb"].includes(tab)){const s=aff()+(tab=="pick"?JSON.stringify(S.mats):"");if(s!=sig){sig=s;P()}}},1000);
let cw=false;
const num=id=>{const v=parseFloat($("#"+id).value);return isFinite(v)?v:0};
const opt=(a,sel)=>a.map(([v,t])=>'<option value="'+v+'"'+(v==sel?" selected":"")+">"+t+"</option>").join("");
function admHtml(){const A=S.adm;
let h='<h2>Recursos</h2><div class="f"><label>Recurso<select id="a_res">'+opt([["coins","💰 Moedas"],...Object.keys(MAT).map(k=>[k,MAT[k]+" "+k]),["rp","🎟️ Pontos de renascimento"],["rb","♻️ Renascimentos"]])+'</select></label><label>Quantidade<input id="a_amt" type="number" value="1000"></label><button class="go" onclick="admGive(0)">Dar</button><button onclick="admGive(1)">Definir</button></div>';
h+='<h2>Picareta e melhorias</h2><div class="f"><label>Picareta<select id="a_tier">'+opt(TIERS.map((t,i)=>[i,t.e+" "+t.n]),S.tier)+'</select></label><button class="go" onclick="admTier()">Definir</button></div>';
h+='<div class="f">'+[["d","Nível de dano"],["c","Nível de moedas"],["a","Nível auto"]].map(x=>'<label>'+x[1]+'<input id="a_u'+x[0]+'" type="number" value="'+S.up[x[0]]+'"></label>').join("")+'<button class="go" onclick="admUp()">Aplicar níveis</button></div>';
h+='<h2>Áreas e pets</h2><div class="f"><button class="go" onclick="admBoss()">👹 Invocar chefe</button><button class="go" onclick="admZones()">Desbloquear todas as áreas</button></div><div class="f"><label>Pet<select id="a_pet">'+opt(Object.keys(PET).map((k,i)=>[i,k+" (+"+Math.round(PET[k]*100)+"%)"]),0)+'</select></label><label>Qtd<input id="a_pn" type="number" value="1"></label><button class="go" onclick="admPet()">Dar pet</button><button onclick="admPets0()">Limpar pets</button></div>';
h+='<h2>Multiplicadores do jogo</h2><div class="f">'+[["dm","Dano x"],["cm","Moedas x"],["hp","Vida dos blocos x"],["ep","Preço dos ovos x"],["up","Preço das melhorias x"],["rb","Custo do renascimento x"]].map(x=>'<label>'+x[1]+'<input id="m_'+x[0]+'" type="number" step="any" value="'+A[x[0]]+'"></label>').join("")+'<label>Aviso aos jogadores<input id="m_msg" type="text" maxlength="120" style="width:260px" value="'+esc(CFG.msg||"")+'"></label><button class="go" onclick="admMul(0)">Publicar para todos</button><button onclick="admMul(1)">Resetar</button></div>';
h+='<h2>Zona de perigo</h2><div class="f"><button onclick="admWipe()">'+(cw?"Confirmar: apagar tudo":"Apagar todo o progresso")+'</button></div>';
return h}
const done=()=>{P();hdr();save();toast("Aplicado")};
function admGive(set){const r=$("#a_res").value,v=num("a_amt");if(r=="coins")S.coins=Math.max(0,set?v:S.coins+v);else if(r=="rp")S.rp=Math.max(0,set?v:S.rp+v);else if(r=="rb")S.rb=Math.max(0,Math.floor(set?v:S.rb+v));else S.mats[r]=Math.max(0,set?v:(S.mats[r]||0)+v);done()}
function admTier(){S.tier=+$("#a_tier").value;done()}
function admUp(){["d","c","a"].forEach(k=>S.up[k]=Math.max(0,Math.floor(num("a_u"+k))));done()}
function admZones(){S.uz=ZONES.map((z,i)=>i);mapBar();done()}
function admPet(){const n=Object.keys(PET)[+$("#a_pet").value];S.pets[n]=(S.pets[n]||0)+Math.max(1,Math.floor(num("a_pn")));done()}
function admPets0(){S.pets={};done()}
function admMul(r){const c={};Object.keys(S.adm).forEach(k=>c[k]=r?1:Math.max(.01,num("m_"+k)||1));c.msg=r?"":($("#m_msg").value||"").slice(0,120);pushCfg(c)}
function admWipe(){if(!cw){cw=true;P();return}try{localStorage.removeItem("mcs_v1")}catch(e){}S=fresh();cw=false;mapBar();build();done()}
let sig="";
const aff=()=>[...Object.keys(UP).map(k=>S.coins>=upCost(k)),...EGGS.map(e=>S.coins>=eggC(e)),S.coins>=rbCost(),rpGain(),(()=>{const n=TIERS[S.tier+1];return !!n&&S.coins>=n.c&&Object.keys(n.m).every(k=>(S.mats[k]||0)>=n.m[k])})()].join();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DB=null,UID=null,rank=[],rcrit="tot",rkErr="",lastPush="";
const RKC={tot:["💰 Moedas totais",x=>x.tot||0],rbn:["♻️ Renascimentos",x=>x.rbn||0]};
const rkDraw=()=>{if(tab=="rank"&&document.activeElement.id!="k_nick")P()};
(async()=>{try{const d=await claude.use("db"),u=await claude.use("user");if(!d||!u)return;DB=d;UID=await u.id();OWNER=!!u.isOwner();tabs();DB.doc("config/game").onSnapshot(s=>applyCfg(s.exists?s.data():{}),()=>{});const to=setTimeout(()=>{rkErr="Não foi possível carregar o ranking agora.";rkDraw()},10000);DB.collection("ranking").orderBy("tot","desc").limit(100).onSnapshot(s=>{clearTimeout(to);rkErr="";rank=s.docs.map(x=>x.data());rkDraw()},e=>{clearTimeout(to);rkErr="Ranking indisponível.";rkDraw()});rkDraw()}catch(e){}})();
function rankHtml(){let h='<h2>Seu perfil no ranking</h2><div class="f"><label>Apelido<input id="k_nick" maxlength="16" type="text" value="'+esc(S.nick)+'" style="width:150px"></label><button class="go" onclick="rkSave()">Salvar e enviar</button></div>';
h+='<div class="tabs">'+Object.keys(RKC).map(k=>'<button class="'+(rcrit==k?"on":"")+'" onclick="rkCrit(\''+k+'\')">'+RKC[k][0]+"</button>").join("")+"</div>";
if(!DB)return h+'<div class="panel-title">📊 Recordes deste aparelho</div><div class="row"><b>Maior total de moedas</b><b>'+fmt(S.localRecords.coins||S.tot)+'</b></div><div class="row"><b>Chefes derrotados</b><b>'+(S.localRecords.bosses||S.bossWins||0)+'</b></div><div class="row"><b>Maior nível</b><b>'+(S.localRecords.level||S.level)+'</b></div><div class="row"><b>Renascimentos</b><b>'+(S.localRecords.rebirths||S.rbn)+'</b></div><p class="muted">Ranking local: estes recordes existem somente neste aparelho. O ranking global poderá ser ativado quando a conexão online estiver disponível.</p>';

const f=RKC[rcrit][1],L=[...rank].sort((a,b)=>f(b)-f(a)).slice(0,20);
if(rkErr)h+='<p class="bad">'+rkErr+"</p>";
return h+(L.length?L.map((x,i)=>'<div class="row" style="'+(x.uid==UID?"border-color:var(--ac);border-width:2px":"")+'"><div><b>'+(["🥇","🥈","🥉"][i]||"#"+(i+1))+" "+esc(x.nick||"Anônimo")+"</b><small>💰 "+fmt(x.tot||0)+" · ♻️ "+(x.rbn||0)+"</small></div><b>"+(rcrit=="tot"?fmt(f(x)):f(x))+"</b></div>").join(""):"<p>Ninguém no ranking ainda. Salve seu apelido para ser o primeiro.</p>")}
async function push(force){if(!DB||!UID||!S.nick)return false;const k=Math.floor(S.tot)+"|"+S.rbn+"|"+S.nick;if(!force&&k==lastPush)return true;try{await DB.doc("ranking/"+UID).set({uid:UID,nick:S.nick,tot:Math.floor(S.tot),rbn:S.rbn,t:Date.now()});lastPush=k;return true}catch(e){return false}}
async function rkSave(){S.nick=($("#k_nick").value||"").trim().slice(0,16);if(!S.nick)return toast("Digite um apelido");save();toast(await push(true)?"Ranking atualizado!":"Não foi possível enviar");P()}
function rkCrit(k){rcrit=k;P()}
const BN=["Golem de Pedra","Rei de Ferro","Dragão de Fogo","Colosso de Diamante","Titã de Cristal","Senhor da Obsidiana","Guardião Celestial","Deus Cósmico","Ancião do Abismo","Devorador Dimensional"];
let boss=null,bossIn=60;
function spawnBoss(){const z=S.zone,m=ZONES[z].hp*15*S.adm.hp*(1+S.bossWins*.08);boss={z,hp:m,max:m,t:55};toast("👹 "+BN[z]+" apareceu! Ataque manual e apoio dos Minions!");bossUI()}
function bossUI(){const b=$("#bs");b.hidden=!boss;if(!boss)return;$("#bn").textContent="👹 "+BN[boss.z];$("#bt").textContent=boss.t+"s · "+fmt(Math.max(0,boss.hp))+" / "+fmt(boss.max);$("#bb").style.width=Math.max(0,boss.hp/boss.max*100)+"%"}
function rollEgg(i){const e=EGGS[i],w=e.p.map((x,j)=>x[2]*(1+.1*S.rbu.l*j)),T=w.reduce((a,b)=>a+b,0);let r=Math.random()*T,k=0;while(k<w.length-1&&r>w[k]){r-=w[k];k++}const p=e.p[k][0];S.pets[p]=(S.pets[p]||0)+1;S.petLevels[p]=S.petLevels[p]||1;S.petXP[p]=S.petXP[p]||0;S.petStars[p]=S.petStars[p]||0;S.last=p+" (+"+Math.round(e.p[k][1]*100)+"%)";return p}
const petNeed=l=>Math.floor(100*Math.pow(Math.max(1,l),1.35));
function gainPetXP(n){}
function evolvePet(k){if((S.pets[k]||0)<3||(S.petStars[k]||0)>=5)return;S.pets[k]-=2;S.petStars[k]=(S.petStars[k]||0)+1;toast("⭐ "+k+" evoluiu para "+S.petStars[k]+" estrelas!");P();hdr();save()}
function petStage(l){return l>=50?3:l>=25?2:l>=10?1:0}
function petsHtml(){const keys=Object.keys(S.pets).filter(k=>S.pets[k]>0).sort((a,b)=>petPower(b)-petPower(a));let h='<div class="panel-title">🐾 Seus companheiros</div><p class="muted">Pets ganham XP ao minerar e lutar. Evoluções visuais nos níveis 10, 25 e 50. Os três melhores bônus são aplicados automaticamente.</p>';h+='<div class="row"><b>🐾 Pets descobertos</b><b>'+keys.length+' / '+Object.keys(PET).length+'</b></div>';keys.forEach(k=>{const lv=S.petLevels[k]||1,xp=S.petXP[k]||0,stars=S.petStars[k]||0,need=petNeed(lv),stage=petStage(lv);h+='<div class="pet-card"><div class="pet-avatar stage-'+stage+'">'+k.split(" ")[0]+'</div><div class="pet-info"><b>'+esc(k)+' '+("⭐".repeat(stars)||"☆")+'</b><small>Nível '+lv+' · '+["Inicial","Despertado","Evoluído","Ascendido"][stage]+'</small><div class="progress"><i style="width:'+Math.min(100,xp/need*100)+'%"></i></div><small>XP '+fmt(xp)+' / '+fmt(need)+' · Bônus +'+Math.round(petPower(k)*100)+'%</small><small>Duplicatas: '+S.pets[k]+'</small></div><button class="go" '+(S.pets[k]<3||stars>=5?'disabled':'')+' onclick="evolvePet('+JSON.stringify(k)+')">Fundir 3 · ⭐</button></div>'});return h}
function hitBoss(d){if(!boss)return;const hit=(d||dmg())*enchantMultiplier("boss");boss.hp-=hit;S.bossDamage=(S.bossDamage||0)+hit;gainPetXP(Math.max(1,Math.floor(hit/Math.max(1,boss.max)*120)));if(boss.hp<=0){const Z=ZONES[boss.z],g=Z.coin*60*coinM();S.coins+=g;S.tot+=g;S.mats[Z.m]=(S.mats[Z.m]||0)+10;S.bossWins=(S.bossWins||0)+1;questProgress("boss",1);S.localRecords.bosses=Math.max(S.localRecords.bosses||0,S.bossWins);gainXP(100+boss.z*40);gainPetXP(250+boss.z*50);let msg="Chefe derrotado! +"+fmt(g)+" moedas · +10 "+Z.m+" · +XP";toast(msg);boss=null;bossIn=90;hdr();save()}bossUI()}
function bossTick(){if(boss){boss.t--;if(boss.t<=0){toast("O chefe fugiu!");boss=null;bossIn=90}}else if(--bossIn<=0)spawnBoss();bossUI()}
function admBoss(){if(!boss)spawnBoss();toast("Chefe invocado")}
let OWNER=false,CFG={};
const applyCfg=c=>{CFG=c||{};Object.keys(fresh().adm).forEach(k=>S.adm[k]=Number(CFG[k])>0?Number(CFG[k]):1);hdr()};
async function pushCfg(c){if(!DB)return toast("Sem banco de dados aqui");try{await DB.doc("config/game").set(c);toast("Publicado para todos os jogadores")}catch(e){toast("Sem permissão para publicar")}}
const loadCfg=()=>{if(!DB)fetch("config.json",{cache:"no-store"}).then(r=>r.json()).then(applyCfg).catch(()=>{})};
setTimeout(loadCfg,3000);setInterval(loadCfg,300000);
setInterval(()=>push(false),20000);
setInterval(save,5000);
tabs();mapBar();build();renderMineUpgrades();hdr();
</script>
