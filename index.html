h1{font-size:20px;margin:4px 0 8px;font-weight:800;letter-spacing:.2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:4px 10px;font-weight:700}

.tabs{display:flex;gap:4px;margin:8px 0;overflow-x:auto}

button:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
button.on,button.go{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.map{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.map button{min-width:112px;text-align:left;font-size:12px}
.map button small{display:block;color:var(--mut)}

.ore-stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:310px;margin:12px 0 8px;padding:18px;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 75%,#465064 0,#26354a 38%,#101a2b 78%);box-shadow:inset 0 0 35px #050a14,0 8px 24px #050a1455;touch-action:manipulation}.ore-stage:before{content:"";position:absolute;inset:auto 8% 14px;height:30px;border-radius:50%;background:#050a14aa;filter:blur(12px)}.ore-core{position:relative;z-index:1;width:min(74vw,310px);height:250px;border:0;background:transparent;padding:0;filter:drop-shadow(0 22px 14px #050812aa);transition:transform .09s,filter .15s;touch-action:manipulation}.ore-core:active,.ore-core.hit{transform:translateY(5px) scale(.96);filter:drop-shadow(0 9px 8px #050812aa)}.ore-core svg{width:100%;height:100%;overflow:visible}.ore-hp{position:absolute;z-index:2;left:12%;right:12%;bottom:12px;height:12px;border-radius:99px;background:#0a1220;border:2px solid #718096;overflow:hidden;box-shadow:0 2px 8px #0009}.ore-hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#38c77b,#b4f46b);transition:width .12s}.ore-label{position:absolute;z-index:2;top:12px;left:12px;right:12px;text-align:center;color:#eaf3ff;font-weight:800;text-shadow:0 2px 4px #000;pointer-events:none}.ore-particle{position:absolute;z-index:4;left:50%;top:52%;font-size:20px;pointer-events:none;animation:oreBurst .75s ease-out forwards;filter:drop-shadow(0 2px 3px #000)}@keyframes oreBurst{0%{opacity:1;transform:translate(-50%,-50%) scale(.65)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1.25)}}.ore-stage.crack{animation:oreShake .18s linear}@keyframes oreShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}

h2{font-size:15px;margin:12px 0 6px}

<script>
const $=s=>document.querySelector(s);
const fmt=n=>{if(n<1000)return Math.floor(n)+"";const u=["","K","M","B","T","Qa"];let i=0;while(n>=1000&&i<5){n/=1000;i++}return n.toFixed(n<10?2:1)+u[i]};

function oreParticles(z,count=9){const stage=$("#gr");if(!stage)return;const icons=[MAT[z.m]||"✨","✦","✧","◆","●"];for(let i=0;i<count;i++){const p=document.createElement("span");p.className="ore-particle";p.textContent=icons[Math.floor(Math.random()*icons.length)];p.style.setProperty("--dx",(Math.random()*220-110)+"px");p.style.setProperty("--dy",(Math.random()*-170-25)+"px");p.style.setProperty("--rot",(Math.random()*240-120)+"deg");stage.appendChild(p);setTimeout(()=>p.remove(),800)}}

function dayKey(){return new Date().toISOString().slice(0,10)}
function weekKey(){const d=new Date(),u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));u.setUTCDate(u.getUTCDate()+4-(u.getUTCDay()||7));const y=u.getUTCFullYear(),start=new Date(Date.UTC(y,0,1));return y+"-W"+String(Math.ceil((((u-start)/86400000)+1)/7)).padStart(2,"0")}
function resetQuests(){const d=dayKey(),w=weekKey();if(S.dailyQuests.day!==d)S.dailyQuests={day:d,progress:{},claimed:[]};if(S.weeklyQuests.week!==w)S.weeklyQuests={week:w,progress:{},claimed:[]};if(S.event.day!==d)S.event={day:d,points:0,claimed:false}}

const WEEKLY=[{id:"ores",n:"Semana produtiva",d:"Quebre 1.000 minérios",goal:1000,type:"mined",coins:100000,chests:3},{id:"boss",n:"Lenda das cavernas",d:"Derrote 8 chefes",goal:8,type:"boss",rp:10,chests:4},{id:"forge",n:"Mestre ferreiro",d:"Melhore a forja 3 vezes",goal:3,type:"forge",coins:75000,chests:2}];
function questProgress(type,n){resetQuests();S.dailyQuests.progress[type]=(S.dailyQuests.progress[type]||0)+n;S.weeklyQuests.progress[type]=(S.weeklyQuests.progress[type]||0)+n;S.event.points+=Math.max(1,Math.floor(type==="coins"?n/100:type==="boss"?100:type==="forge"?50:n))*(activeEvent().bonus==="crystals"&&type==="mined"?2:1)}
function questClaim(kind,id){resetQuests();const list=kind==="daily"?DAILY:WEEKLY,state=kind==="daily"?S.dailyQuests:S.weeklyQuests,x=list.find(v=>v.id===id);if(!x||state.claimed.includes(id)||(state.progress[x.type]||0)<x.goal)return;state.claimed.push(id);S.coins+=x.coins||0;S.tot+=x.coins||0;S.rp+=x.rp||0;S.chests+=x.chests||0;toast("🎁 Missão concluída! Recompensas coletadas.");P();hdr();save()}
function questList(kind){const list=kind==="daily"?DAILY:WEEKLY,state=kind==="daily"?S.dailyQuests:S.weeklyQuests;return list.map(x=>{const v=Math.min(x.goal,state.progress[x.type]||0),done=v>=x.goal,claimed=state.claimed.includes(x.id);return '<div class="mission '+(done?'done':'')+'"><div class="mission-top"><b>'+(kind==="daily"?'☀️ ':'📅 ')+x.n+'</b><b>'+(claimed?'✅ Resgatada':done?'🏆 Pronta':'🎁 Recompensa')+'</b></div><div class="mission-desc">'+x.d+'</div><div class="progress"><i style="width:'+Math.min(100,v/x.goal*100)+'%"></i></div><small>'+fmt(v)+' / '+fmt(x.goal)+' · '+(x.coins?fmt(x.coins)+' moedas · ':'')+(x.rp?x.rp+' tickets · ':'')+x.chests+' baús</small>'+(done&&!claimed?'<button class="go" onclick="questClaim(\''+kind+'\',\''+x.id+'\')">Resgatar</button>':'')+'</div>'}).join('')}
const EVENTS=[{n:"Chuva de Ouro",e:"🌧️💰",d:"Ganhe 2x moedas ao minerar.",bonus:"coins"},{n:"Mineração Frenética",e:"⚡",d:"Minions causam 2x dano.",bonus:"minions"},{n:"Caça aos Cristais",e:"💎",d:"Ganhe pontos extras ao quebrar minérios.",bonus:"crystals"},{n:"Invasão de Chefes",e:"👹",d:"Chefes dão recompensas dobradas.",bonus:"boss"}];
function activeEvent(){return EVENTS[Math.floor(Date.now()/86400000)%EVENTS.length]}
function eventsHtml(){resetQuests();const ev=activeEvent();let h='<div class="panel-title">🎉 Evento do dia</div><div class="mission done"><div style="font-size:36px">'+ev.e+'</div><b>'+ev.n+'</b><div class="mission-desc">'+ev.d+'</div><small>Pontos do evento: '+fmt(S.event.points)+'</small><div class="progress"><i style="width:'+Math.min(100,S.event.points/1000*100)+'%"></i></div><small>Meta: 1.000 pontos · Recompensa: 25.000 moedas + 5 tickets + 3 baús</small><button class="go" '+(S.event.points<1000||S.event.claimed?'disabled':'')+' onclick="claimEvent()">Resgatar prêmio</button></div><p class="muted">O evento muda diariamente. Pontuação e resgate são salvos neste aparelho.</p><div class="panel-title">☀️ Missões diárias</div>'+questList("daily")+'<div class="panel-title">📅 Missões semanais</div>'+questList("weekly");return h}

function forgeHtml(){const lv=S.forge.level||0,cost=Math.ceil(15000*Math.pow(2.1,lv)),mat=Math.max(20,lv*20+20);let h='<div class="panel-title">🔥 Forja do minerador</div><p class="muted">Aprimore o dano base e aplique até dois encantamentos permanentes à sua picareta. A forja e os encantamentos sobrevivem ao renascimento.</p><div class="row"><div><b>🔥 Forja nível '+lv+'</b><small>Multiplicador de dano: x'+forgeMultiplier().toFixed(2)+'</small><small>Próximo nível: '+fmt(cost)+' moedas + '+mat+' ferro</small></div><button class="go" '+(S.coins<cost||(S.mats.ferro||0)<mat?'disabled':'')+' onclick="forgeUpgrade()">Melhorar</button></div><h2>✨ Encantamentos ('+S.forge.enchants.length+'/2)</h2>';h+=ENCHANTS.map(x=>{const has=S.forge.enchants.includes(x.id),ok=S.coins>=x.cost&&Object.keys(x.m).every(k=>(S.mats[k]||0)>=x.m[k]);return '<div class="row"><div><b>'+x.e+' '+x.n+(has?' · Equipado':'')+'</b><small>'+x.desc+'</small><small>'+fmt(x.cost)+' moedas · '+Object.entries(x.m).map(([k,v])=>v+' '+k).join(', ')+'</small></div><button class="go" '+(has||S.forge.enchants.length>=2||!ok?'disabled':'')+' onclick="forgeEnchant(\''+x.id+'\')">'+(has?'Aplicado':'Forjar')+'</button></div>'}).join('');return h}

h+='<div class="f">'+[["d","Nível de dano"],["c","Nível de moedas"],["a","Nível auto"]].map(x=>'<label>'+x[1]+'<input id="a_u'+x[0]+'" type="number" value="'+S.up[x[0]]+'"></label>').join("")+'<button class="go" onclick="admUp()">Aplicar níveis</button></div>';
h+='<h2>Áreas e pets</h2><div class="f"><button class="go" onclick="admBoss()">👹 Invocar chefe</button><button class="go" onclick="admZones()">Desbloquear todas as áreas</button></div><div class="f"><label>Pet<select id="a_pet">'+opt(Object.keys(PET).map((k,i)=>[i,k+" (+"+Math.round(PET[k]*100)+"%)"]),0)+'</select></label><label>Qtd<input id="a_pn" type="number" value="1"></label><button class="go" onclick="admPet()">Dar pet</button><button onclick="admPets0()">Limpar pets</button></div>';
h+='<h2>Multiplicadores do jogo</h2><div class="f">'+[["dm","Dano x"],["cm","Moedas x"],["hp","Vida dos blocos x"],["ep","Preço dos ovos x"],["up","Preço das melhorias x"],["rb","Custo do renascimento x"]].map(x=>'<label>'+x[1]+'<input id="m_'+x[0]+'" type="number" step="any" value="'+A[x[0]]+'"></label>').join("")+'<label>Aviso aos jogadores<input id="m_msg" type="text" maxlength="120" style="width:260px" value="'+esc(CFG.msg||"")+'"></label><button class="go" onclick="admMul(0)">Publicar para todos</button><button onclick="admMul(1)">Resetar</button></div>';
h+='<h2>Zona de perigo</h2><div class="f"><button onclick="admWipe()">'+(cw?"Confirmar: apagar tudo":"Apagar todo o progresso")+'</button></div>';
return h}
const done=()=>{P();hdr();save();toast("Aplicado")};
function admGive(set){const r=$("#a_res").value,v=num("a_amt");if(r=="coins")S.coins=Math.max(0,set?v:S.coins+v);else if(r=="rp")S.rp=Math.max(0,set?v:S.rp+v);else if(r=="rb")S.rb=Math.max(0,Math.floor(set?v:S.rb+v));else S.mats[r]=Math.max(0,set?v:(S.mats[r]||0)+v);done()}
function admTier(){S.tier=+$("#a_tier").value;done()}
function admUp(){["d","c","a"].forEach(k=>S.up[k]=Math.max(0,Math.floor(num("a_u"+k))));done()}
function admZones(){S.uz=ZONES.map((z,i)=>i);mapBar();done()}
function admPet(){const n=Object.keys(PET)[+$("#a_pet").value];S.pets[n]=(S.pets[n]||0)+Math.max(1,Math.floor(num("a_pn")));done()}
function admPets0(){S.pets={};done()}
function admMul(r){const c={};Object.keys(S.adm).forEach(k=>c[k]=r?1:Math.max(.01,num("m_"+k)||1));c.msg=r?"":($("#m_msg").value||"").slice(0,120);pushCfg(c)}
function admWipe(){if(!cw){cw=true;P();return}try{localStorage.removeItem("mcs_v1")}catch(e){}S=fresh();cw=false;mapBar();build();done()}
let sig="";
const aff=()=>[...Object.keys(UP).map(k=>S.coins>=upCost(k)),...EGGS.map(e=>S.coins>=eggC(e)),S.coins>=rbCost(),rpGain(),(()=>{const n=TIERS[S.tier+1];return !!n&&S.coins>=n.c&&Object.keys(n.m).every(k=>(S.mats[k]||0)>=n.m[k])})()].join();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let DB=null,UID=null,rank=[],rcrit="tot",rkErr="",lastPush="";
const RKC={tot:["💰 Moedas totais",x=>x.tot||0],rbn:["♻️ Renascimentos",x=>x.rbn||0]};
const rkDraw=()=>{if(tab=="rank"&&document.activeElement.id!="k_nick")P()};
(async()=>{try{const d=await claude.use("db"),u=await claude.use("user");if(!d||!u)return;DB=d;UID=await u.id();OWNER=!!u.isOwner();tabs();DB.doc("config/game").onSnapshot(s=>applyCfg(s.exists?s.data():{}),()=>{});const to=setTimeout(()=>{rkErr="Não foi possível carregar o ranking agora.";rkDraw()},10000);DB.collection("ranking").orderBy("tot","desc").limit(100).onSnapshot(s=>{clearTimeout(to);rkErr="";rank=s.docs.map(x=>x.data());rkDraw()},e=>{clearTimeout(to);rkErr="Ranking indisponível.";rkDraw()});rkDraw()}catch(e){}})();
function rankHtml(){let h='<h2>Seu perfil no ranking</h2><div class="f"><label>Apelido<input id="k_nick" maxlength="16" type="text" value="'+esc(S.nick)+'" style="width:150px"></label><button class="go" onclick="rkSave()">Salvar e enviar</button></div>';
h+='<div class="tabs">'+Object.keys(RKC).map(k=>'<button class="'+(rcrit==k?"on":"")+'" onclick="rkCrit(\''+k+'\')">'+RKC[k][0]+"</button>").join("")+"</div>";
if(!DB)return h+'<div class="panel-title">📊 Recordes deste aparelho</div><div class="row"><b>Maior total de moedas</b><b>'+fmt(S.localRecords.coins||S.tot)+'</b></div><div class="row"><b>Chefes derrotados</b><b>'+(S.localRecords.bosses||S.bossWins||0)+'</b></div><div class="row"><b>Maior nível</b><b>'+(S.localRecords.level||S.level)+'</b></div><div class="row"><b>Renascimentos</b><b>'+(S.localRecords.rebirths||S.rbn)+'</b></div><p class="muted">Ranking local: estes recordes existem somente neste aparelho. O ranking global poderá ser ativado quando a conexão online estiver disponível.</p>';

const f=RKC[rcrit][1],L=[...rank].sort((a,b)=>f(b)-f(a)).slice(0,20);
if(rkErr)h+='<p class="bad">'+rkErr+"</p>";
return h+(L.length?L.map((x,i)=>'<div class="row" style="'+(x.uid==UID?"border-color:var(--ac);border-width:2px":"")+'"><div><b>'+(["🥇","🥈","🥉"][i]||"#"+(i+1))+" "+esc(x.nick||"Anônimo")+"</b><small>💰 "+fmt(x.tot||0)+" · ♻️ "+(x.rbn||0)+"</small></div><b>"+(rcrit=="tot"?fmt(f(x)):f(x))+"</b></div>").join(""):"<p>Ninguém no ranking ainda. Salve seu apelido para ser o primeiro.</p>")}
async function push(force){if(!DB||!UID||!S.nick)return false;const k=Math.floor(S.tot)+"|"+S.rbn+"|"+S.nick;if(!force&&k==lastPush)return true;try{await DB.doc("ranking/"+UID).set({uid:UID,nick:S.nick,tot:Math.floor(S.tot),rbn:S.rbn,t:Date.now()});lastPush=k;return true}catch(e){return false}}
async function rkSave(){S.nick=($("#k_nick").value||"").trim().slice(0,16);if(!S.nick)return toast("Digite um apelido");save();toast(await push(true)?"Ranking atualizado!":"Não foi possível enviar");P()}
function rkCrit(k){rcrit=k;P()}
const BN=["Golem de Pedra","Rei de Ferro","Dragão de Fogo","Colosso de Diamante","Titã de Cristal","Senhor da Obsidiana","Guardião Celestial","Deus Cósmico","Ancião do Abismo","Devorador Dimensional"];
let boss=null,bossIn=60;
function spawnBoss(){const z=S.zone,m=ZONES[z].hp*15*S.adm.hp*(1+S.bossWins*.08);boss={z,hp:m,max:m,t:55};toast("👹 "+BN[z]+" apareceu! Ataque manual e apoio dos Minions!");bossUI()}
function bossUI(){const b=$("#bs");b.hidden=!boss;if(!boss)return;$("#bn").textContent="👹 "+BN[boss.z];$("#bt").textContent=boss.t+"s · "+fmt(Math.max(0,boss.hp))+" / "+fmt(boss.max);$("#bb").style.width=Math.max(0,boss.hp/boss.max*100)+"%"}
function rollEgg(i){const e=EGGS[i],w=e.p.map((x,j)=>x[2]*(1+.1*S.rbu.l*j)),T=w.reduce((a,b)=>a+b,0);let r=Math.random()*T,k=0;while(k<w.length-1&&r>w[k]){r-=w[k];k++}const p=e.p[k][0];S.pets[p]=(S.pets[p]||0)+1;S.petLevels[p]=S.petLevels[p]||1;S.petXP[p]=S.petXP[p]||0;S.petStars[p]=S.petStars[p]||0;S.last=p+" (+"+Math.round(e.p[k][1]*100)+"%)";return p}
const petNeed=l=>Math.floor(100*Math.pow(Math.max(1,l),1.35));
function gainPetXP(n){const owned=Object.keys(S.pets).filter(k=>S.pets[k]>0);if(!owned.length)return;owned.forEach(k=>{S.petXP[k]=(S.petXP[k]||0)+n;while(S.petXP[k]>=petNeed(S.petLevels[k]||1)){S.petXP[k]-=petNeed(S.petLevels[k]||1);S.petLevels[k]=(S.petLevels[k]||1)+1;if([10,25,50].includes(S.petLevels[k]))toast("✨ "+k+" evoluiu visualmente! Nível "+S.petLevels[k])}})}
function evolvePet(k){if((S.pets[k]||0)<3||(S.petStars[k]||0)>=5)return;S.pets[k]-=2;S.petStars[k]=(S.petStars[k]||0)+1;toast("⭐ "+k+" evoluiu para "+S.petStars[k]+" estrelas!");P();hdr();save()}
function petStage(l){return l>=50?3:l>=25?2:l>=10?1:0}
function petsHtml(){const keys=Object.keys(S.pets).filter(k=>S.pets[k]>0).sort((a,b)=>petPower(b)-petPower(a));let h='<div class="panel-title">🐾 Seus companheiros</div><p class="muted">Pets ganham XP ao minerar e lutar. Evoluções visuais nos níveis 10, 25 e 50. Os três melhores bônus são aplicados automaticamente.</p>';h+='<div class="row"><b>🐾 Pets descobertos</b><b>'+keys.length+' / '+Object.keys(PET).length+'</b></div>';keys.forEach(k=>{const lv=S.petLevels[k]||1,xp=S.petXP[k]||0,stars=S.petStars[k]||0,need=petNeed(lv),stage=petStage(lv);h+='<div class="pet-card"><div class="pet-avatar stage-'+stage+'">'+k.split(" ")[0]+'</div><div class="pet-info"><b>'+esc(k)+' '+("⭐".repeat(stars)||"☆")+'</b><small>Nível '+lv+' · '+["Inicial","Despertado","Evoluído","Ascendido"][stage]+'</small><div class="progress"><i style="width:'+Math.min(100,xp/need*100)+'%"></i></div><small>XP '+fmt(xp)+' / '+fmt(need)+' · Bônus +'+Math.round(petPower(k)*100)+'%</small><small>Duplicatas: '+S.pets[k]+'</small></div><button class="go" '+(S.pets[k]<3||stars>=5?'disabled':'')+' onclick="evolvePet('+JSON.stringify(k)+')">Fundir 3 · ⭐</button></div>'});return h}
function hitBoss(d){if(!boss)return;const hit=(d||dmg())*enchantMultiplier("boss");boss.hp-=hit;S.bossDamage=(S.bossDamage||0)+hit;gainPetXP(Math.max(1,Math.floor(hit/Math.max(1,boss.max)*120)));if(boss.hp<=0){const Z=ZONES[boss.z],g=Z.coin*60*coinM()*(activeEvent().bonus==="boss"?2:1);S.coins+=g;S.tot+=g;S.mats[Z.m]=(S.mats[Z.m]||0)+10;S.bossWins=(S.bossWins||0)+1;questProgress("boss",1);S.localRecords.bosses=Math.max(S.localRecords.bosses||0,S.bossWins);gainXP(100+boss.z*40);gainPetXP(250+boss.z*50);let msg="Chefe derrotado! +"+fmt(g)+" moedas · +10 "+Z.m+" · +XP";if(Math.random()<.35)msg+=" · pet "+rollEgg(Math.min(boss.z,3));toast(msg);boss=null;bossIn=90;hdr();save()}bossUI()}
function bossTick(){if(boss){boss.t--;if(boss.t<=0){toast("O chefe fugiu!");boss=null;bossIn=90}}else if(--bossIn<=0)spawnBoss();bossUI()}
function admBoss(){if(!boss)spawnBoss();toast("Chefe invocado")}
let OWNER=false,CFG={};
const applyCfg=c=>{CFG=c||{};Object.keys(fresh().adm).forEach(k=>S.adm[k]=Number(CFG[k])>0?Number(CFG[k]):1);hdr()};
async function pushCfg(c){if(!DB)return toast("Sem banco de dados aqui");try{await DB.doc("config/game").set(c);toast("Publicado para todos os jogadores")}catch(e){toast("Sem permissão para publicar")}}
const loadCfg=()=>{if(!DB)fetch("config.json",{cache:"no-store"}).then(r=>r.json()).then(applyCfg).catch(()=>{})};
setTimeout(loadCfg,3000);setInterval(loadCfg,300000);
setInterval(()=>push(false),20000);
setInterval(save,5000);
tabs();mapBar();build();hdr();
</script>
<script>if("serviceWorker" in navigator&&location.protocol.indexOf("http")==0)navigator.serviceWorker.register("sw.js").catch(()=>{});</script>
